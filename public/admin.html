<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>רכב בקליק — ניהול</title>
  <meta name="theme-color" content="#151a35">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="topbar">
    <div>
      <div class="logo"><span class="blue">רכב</span> <span class="gold">בקליק</span></div>
      <div class="sub">לוח ניהול</div>
    </div>
    <div class="user-info hidden" id="user-info">
      <div id="admin-name"></div>
      <button class="link" id="logout-btn" type="button">התנתקות</button>
    </div>
  </header>

  <main class="app wide">
    <div id="msg"></div>

    <!-- התחברות -->
    <section id="view-login" class="hidden">
      <div class="card" style="max-width:420px;margin:0 auto">
        <h2>כניסת מנהל מערכת</h2>
        <form id="login-form">
          <div class="field">
            <label for="l-email">אימייל</label>
            <input id="l-email" type="email" autocomplete="username" required>
          </div>
          <div class="field">
            <label for="l-password">סיסמה</label>
            <input id="l-password" type="password" autocomplete="current-password" required>
          </div>
          <button class="btn" type="submit">כניסה</button>
        </form>
      </div>
    </section>

    <!-- לוח ניהול -->
    <section id="view-dash" class="hidden">
      <div class="tabs">
        <button data-tab="requests" class="on">בקשות</button>
        <button data-tab="offers">הצעות</button>
        <button data-tab="suppliers">ספקים</button>
      </div>
      <div id="tab-requests"></div>
      <div id="tab-offers" class="hidden"></div>
      <div id="tab-suppliers" class="hidden"></div>
    </section>
  </main>

  <script src="/admin.js"></script>
</body>
</html>
