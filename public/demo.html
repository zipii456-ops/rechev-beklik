<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>רכב בקליק — כניסה מהירה</title>
  <meta name="theme-color" content="#003b95">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="רכב בקליק">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="topbar">
    <div>
      <div class="logo"><span class="blue">רכב</span> <span class="gold">בקליק</span></div>
      <div class="sub">כניסה מהירה — בחרו עם מי להיכנס</div>
    </div>
  </header>

  <main class="app">
    <div id="msg"></div>

    <div class="card">
      <h2>👤 לקוח</h2>
      <p class="hint">לקוח נכנס בלי סיסמה בכלל — פשוט ממלא בקשה.</p>
      <a class="btn" href="/" target="_blank" rel="noopener">כניסה כלקוח (טאב חדש)</a>
    </div>

    <div class="section-title">🏢 ספקים</div>
    <div id="suppliers"><div class="card empty">טוען...</div></div>

    <div class="section-title">🛠️ ניהול</div>
    <div id="admin"></div>

    <footer class="credit">עמוד זה נועד לבדיקות והדגמה בלבד · <a href="/install">התקנת האפליקציה בטלפון</a></footer>
  </main>

  <script src="/demo.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
